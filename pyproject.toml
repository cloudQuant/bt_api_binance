[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bt_api_binance"
version = "2.0.1"
description = "Binance exchange plugin for bt_api"
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
requires-python = ">=3.9"
dependencies = [
    "bt_api_base>=0.15,<1.0",
    "requests>=2.28",
    "websocket-client>=1.5",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
test = ["scikit-learn"]

[project.entry-points."bt_api.plugins"]
binance = "bt_api_binance.plugin:register_plugin"

[project.entry-points."bt_api.provider_configurations"]
BINANCE___SWAP = "bt_api_binance.provider_configuration_registration:register_binance_provider_configuration"

[project.entry-points."bt_api.managed_runtime_providers"]
BINANCE___SWAP = "bt_api_binance.managed_runtime_provider:register_binance_managed_runtime_provider"

[project.entry-points."bt_api.read_only_route_owners"]
BINANCE___SWAP = "bt_api_binance.managed_runtime_provider:register_binance_read_only_route_owner"

[project.entry-points."bt_api.execution_identity_assurance_providers"]
BINANCE___SWAP = "bt_api_binance.execution_identity_assurance_provider:register_binance_execution_identity_assurance_provider"

[project.entry-points."bt_api.query_providers"]
BINANCE___SWAP = "bt_api_binance.unified_account_provider:register_binance_query_provider"

[project.entry-points."bt_api.account_session_providers"]
BINANCE___SWAP = "bt_api_binance.unified_account_provider:register_binance_account_session_provider"

[project.entry-points."bt_api.market_stream_providers"]
BINANCE___SWAP = "bt_api_binance.market_stream_provider:register_binance_market_stream_provider"

[project.entry-points."bt_api.order_identity_projections"]
BINANCE___SPOT = "bt_api_binance.order_identity_projection:project_order_identity"
BINANCE___SWAP = "bt_api_binance.order_identity_projection:project_order_identity"

[project.entry-points."bt_api.order_request_projections"]
BINANCE___SPOT = "bt_api_binance.order_request_mapping:map_order_request"
BINANCE___SWAP = "bt_api_binance.order_request_mapping:map_order_request"

[project.entry-points."bt_api.order_readiness_providers"]
BINANCE___SWAP = "bt_api_binance.order_readiness_service:collect_order_readiness"

[project.entry-points."bt_api.direct_write_providers"]
BINANCE___SWAP = "bt_api_binance.direct_write_provider:create_binance_direct_write_provider"

[project.entry-points."bt_api.position_mode_writers"]
BINANCE___SWAP = "bt_api_binance.position_mode_projection:write_position_mode"

[project.entry-points."bt_api.account_config_read_aliases"]
BINANCE___SPOT = "bt_api_binance.account_config_projection:account_config_read_aliases"
BINANCE___SWAP = "bt_api_binance.account_config_projection:account_config_read_aliases"

[project.entry-points."bt_api.order_quantity_unit_validators"]
BINANCE___SPOT = "bt_api_base.order_quantity_units:validate_generic_order_quantity_units"
BINANCE___SWAP = "bt_api_base.order_quantity_units:validate_generic_order_quantity_units"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bt_api_binance = ["configs/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    "venv",
    "*.bak",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "RUF100", "S", "PERF", "PIE790"]
ignore = ["E501", "B008", "N802", "N803", "S101", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106", "S105", "S311", "E402", "PERF401", "N806", "S108"]
"examples/**" = ["S106", "S105", "S311", "E402", "PERF401", "N806", "S108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "kline: Kline/bar data tests",
    "orderbook: Orderbook/depth data tests",
    "ticker: Public ticker data tests",
    "network: Tests requiring network access",
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external services)",
]

[project.entry-points."bt_api.fee_projections"]
BINANCE___SPOT = "bt_api_base.fee_projection:legacy_fee_projection"
BINANCE___SWAP = "bt_api_base.fee_projection:legacy_fee_projection"

[project.entry-points."bt_api.instrument_rules_projections"]
BINANCE___SPOT = "bt_api_binance.instrument_rules_projection:project_instrument_rules"
BINANCE___SWAP = "bt_api_binance.instrument_rules_projection:project_instrument_rules"

[project.entry-points."bt_api.error_classifiers"]
BINANCE = "bt_api_binance.error_classification:classify_error"

[project.entry-points."bt_api.order_side_projections"]
BINANCE___SPOT = "bt_api_binance.order_side_projection:order_side_candidates"
BINANCE___SWAP = "bt_api_binance.order_side_projection:order_side_candidates"

[project.entry-points."bt_api.normalization_policies"]
BINANCE___SPOT = "bt_api_binance.normalization_policy:normalization_policy"
BINANCE___SWAP = "bt_api_binance.normalization_policy:normalization_policy"

[project.entry-points."bt_api.execution_configuration_policies"]
BINANCE___SPOT = "bt_api_binance.execution_configuration_policy:execution_configuration_policy"
BINANCE___SWAP = "bt_api_binance.execution_configuration_policy:execution_configuration_policy"

[project.entry-points."bt_api.execution_ledger_identity_policies"]
BINANCE = "bt_api_base.execution_ledger_identity_policy:credential_bound_ledger_policy"

[project.entry-points."bt_api.account_risk_source_policies"]
BINANCE = "bt_api_base.account_risk_source_policy:legacy_account_risk_source_policy"
